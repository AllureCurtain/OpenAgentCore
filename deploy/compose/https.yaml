# Managed HTTPS. The gateway publishes 80 and 443 and also serves Web's domain
# setup, so it is the only service with the Docker socket. Caddy itself still
# runs as 65532. External proxies and hosting platforms omit this file.
services:
  web:
    environment:
      OAC_WEB_INSTALLATION_SOCKET: /domain/api.sock
  gateway:
    user: "0:0"
    command: [/usr/local/bin/oac, gateway]
    working_dir: ${OAC_INSTALL_DIR:-/install}
    environment:
      OAC_INSTALL_DIR: ${OAC_INSTALL_DIR:-/install}
      OAC_DATA_MOUNT: /data
      DOCKER_HOST: unix:///var/run/docker.sock
      HOME: /tmp
      DOCKER_CONFIG: /tmp
    ports:
      - "${OAC_HOST:-127.0.0.1}:80:80"
      - "${OAC_HOST:-127.0.0.1}:443:443"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${OAC_INSTALL_DIR:-/install}
        target: ${OAC_INSTALL_DIR:-/install}
      - type: bind
        source: ${OAC_DATA_DIR:-./data}
        target: /data
