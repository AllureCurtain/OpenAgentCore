# Release template. scripts/render-compose.py fills the __OAC_*__ tokens with this
# release's source revision and node-metadata checksum. Images default to the
# floating latest tags; set OAC_IMAGE_CORE, OAC_IMAGE_WEB or OAC_IMAGE_INGRESS
# to select another reference. Do not run this file until it has been rendered.
# Data is bind-mounted from ${OAC_DATA_DIR:-./data}. Set OAC_PUBLIC_URL when the
# platform domain is ready; startup defaults to localhost.
x-ingress-image: &ingress-image ${OAC_IMAGE_INGRESS:-ghcr.io/minimax-ai/openagentcore/ingress:latest}
x-core: &core
  image: ${OAC_IMAGE_CORE:-ghcr.io/minimax-ai/openagentcore/core:latest}
  platform: linux/amd64
  user: "65532:65532"
  read_only: true
  init: true
  tmpfs: [/tmp:mode=1777]
  security_opt: [no-new-privileges:true]
  environment:
    OAC_PUBLIC_URL: &public-url ${OAC_PUBLIC_URL:-http://localhost:8080}
    OAC_DATABASE_URL: postgres://agents_api@database:5432/agents_api?sslmode=disable
    OAC_DATABASE_PASSWORD_FILE: /run/database/password
    OAC_CREDENTIAL_KEY_FILE: /run/oac/credential.key
    OAC_CORE_KEY_DIGESTS_FILE: /run/oac/core-key-digests.json
    OAC_PROVIDER_ROOT: /opt/oac
    OAC_PROVIDER_STATE_ROOT: /state
    OAC_NATIVE_INSTALLER_DIR: /opt/oac/native-installers
    OAC_EXECUTION_CONCURRENCY: ${OAC_EXECUTION_CONCURRENCY:-4}
    OAC_DEFAULT_HARNESS: ${OAC_DEFAULT_HARNESS:-codex}
    OAC_HARNESSES: ${OAC_HARNESSES:-claude_sdk,codex,mcode}
    OAC_WRITE_AUDIT_RETENTION: ${OAC_WRITE_AUDIT_RETENTION:-2160h}
    OAC_OAUTH_TRUSTED_ORIGINS: ${OAC_OAUTH_TRUSTED_ORIGINS:-}
    OAC_LOG_LEVEL: ${OAC_LOG_LEVEL:-info}
    OAC_LOG_FORMAT: ${OAC_LOG_FORMAT:-}
    OAC_LOG_ADD_SOURCE: ${OAC_LOG_ADD_SOURCE:-}
    OAC_HISTORY_SETTINGS_FILE: ${OAC_HISTORY_SETTINGS_FILE:-}
  volumes:
    - type: bind
      source: ${OAC_DATA_DIR:-./data}/secrets/core
      target: /run/oac
      read_only: true
    - type: bind
      source: ${OAC_DATA_DIR:-./data}/secrets/database
      target: /run/database
      read_only: true
    - type: bind
      source: ${OAC_DATA_DIR:-./data}/state
      target: /state

services:
  init:
    image: *ingress-image
    platform: linux/amd64
    restart: "no"
    security_opt: [no-new-privileges:true]
    command: [python3, /init.py]
    configs:
      - source: init-script
        target: /init.py
    environment:
      OAC_REVISION: __OAC_REVISION__
      OAC_RELEASE_BASE: __OAC_RELEASE_BASE__
      OAC_ARCHIVE_CHECKSUM: __OAC_ARCHIVE_CHECKSUM__
    volumes:
      - type: bind
        source: ${OAC_DATA_DIR:-./data}
        target: /data

  database:
    image: postgres:16-alpine
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      POSTGRES_USER: agents_api
      POSTGRES_DB: agents_api
      POSTGRES_PASSWORD_FILE: /run/database/password
    volumes:
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/database
        target: /var/lib/postgresql/data
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/secrets/database
        target: /run/database
        read_only: true
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U agents_api -d agents_api"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *core
    restart: "no"
    command: [/usr/local/bin/oac-core-migrate]
    depends_on:
      database: {condition: service_healthy}

  core:
    <<: *core
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - export OAC_INSTALLATION_ID="$$(cat /run/oac/installation.id)"; exec /usr/local/bin/oac-core
    depends_on:
      migrate: {condition: service_completed_successfully}

  web:
    image: ${OAC_IMAGE_WEB:-ghcr.io/minimax-ai/openagentcore/web:latest}
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    depends_on:
      init: {condition: service_completed_successfully}
    environment:
      OAC_WEB_ORIGIN: *public-url
      OAC_WEB_UPSTREAM: http://core:8091
      OAC_WEB_CORE_KEY_FILE: /run/oac/core.key
      OAC_WEB_NODE_PAYLOAD_DIR: /node-payload
      OAC_WEB_BOOTSTRAP: ${OAC_WEB_BOOTSTRAP:-0}
      OAC_WEB_INSTALLATION_SOCKET: ${OAC_WEB_INSTALLATION_SOCKET:-}
      OAC_LOG_LEVEL: ${OAC_LOG_LEVEL:-info}
      OAC_LOG_FORMAT: ${OAC_LOG_FORMAT:-}
      OAC_LOG_ADD_SOURCE: ${OAC_LOG_ADD_SOURCE:-}
    volumes:
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/secrets/web
        target: /run/oac
        read_only: true
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/node-payload
        target: /node-payload
        read_only: true
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/domain
        target: /domain
        read_only: true

  gateway:
    image: *ingress-image
    platform: linux/amd64
    user: "65532:65532"
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:mode=1777]
    environment:
      XDG_DATA_HOME: /tmp/data
      XDG_CONFIG_HOME: /tmp/config
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    depends_on:
      core: {condition: service_started}
      web: {condition: service_started}
      init: {condition: service_completed_successfully}
    expose: ["8080"]
    configs:
      - source: gateway-config
        target: /etc/caddy/Caddyfile
      - source: gateway-routes
        target: /etc/oac/routes.caddy
    volumes:
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/caddy
        target: /data/caddy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - |
          import urllib.request
          client = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for host in ('core:8091', 'web:8080', '127.0.0.1:8080'):
              with client.open('http://' + host + '/healthz', timeout=3) as response:
                  assert response.status == 200
      interval: 5s
      timeout: 10s
      retries: 30

  # The only service with the Docker socket. It accepts one Core-key request:
  # set the managed domain. Hosting platforms leave this profile disabled.
  domain:
    image: *ingress-image
    platform: linux/amd64
    profiles: ["managed"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    init: true
    tmpfs: [/tmp:mode=1777]
    security_opt: [no-new-privileges:true]
    working_dir: ${OAC_INSTALL_DIR:-/install}
    command: [/usr/local/bin/oac, domain-serve]
    environment:
      OAC_INSTALL_DIR: ${OAC_INSTALL_DIR:-/install}
      OAC_DATA_MOUNT: /data
      DOCKER_HOST: unix:///var/run/docker.sock
      HOME: /tmp
      DOCKER_CONFIG: /tmp
    depends_on:
      init: {condition: service_completed_successfully}
      gateway: {condition: service_healthy}
    configs:
      - source: gateway-config
        target: /etc/caddy/Caddyfile
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: ${OAC_INSTALL_DIR:-/install}
        target: ${OAC_INSTALL_DIR:-/install}
      - type: bind
        source: ${OAC_DATA_DIR:-./data}
        target: /data
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "test -S /data/domain/api.sock"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Explicit operator action; the key is printed only to the attached terminal.
  credentials:
    image: *ingress-image
    platform: linux/amd64
    user: "65532:65532"
    profiles: [tools]
    read_only: true
    logging: {driver: none}
    command: [cat, /run/oac/core.key]
    volumes:
      - type: bind
        source: ${OAC_DATA_DIR:-./data}/secrets/web
        target: /run/oac
        read_only: true

configs:
  gateway-config:
    content: |
      {
      	admin unix//data/caddy/admin.sock
      }
      http://:8080 {
      	import /etc/oac/routes.caddy
      }
      import /data/caddy/site.caddy

  gateway-routes:
    content: |
      @core path /v1 /v1/* /api/v1 /api/v1/*
      handle @core {
      	reverse_proxy core:8091 {
      		flush_interval -1
      	}
      }
      handle {
      	reverse_proxy web:8080 {
      		flush_interval -1
      	}
      }

  init-script:
    content: |
      __OAC_INIT_PY__
