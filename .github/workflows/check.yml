name: core-check

on:
  workflow_call:
    inputs:
      ref:
        description: Source commit to check
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-check-${{ github.workflow }}-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oac_core_ci_tests
          POSTGRES_USER: agents_api
          POSTGRES_PASSWORD: core_test_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agents_api -d oac_core_ci_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: useblacksmith/checkout@v1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Select shared Go caches
        id: source
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "GOCACHE=$HOME/.oac/cache/go-build" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$HOME/.oac/cache/go-mod" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.oac/cache/go-build
            ~/.oac/cache/go-mod
          key: core-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-${{ steps.source.outputs.revision }}
          restore-keys: |
            core-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.mod', '**/go.sum') }}-
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned check prerequisites
        run: |
          npm install --global pnpm@10.30.3
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Install Web acceptance browser
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chrome
      - name: Check standalone repository
        env:
          OAC_TEST_DATABASE_URL: postgres://agents_api:core_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/oac_core_ci_tests?sslmode=disable
        run: make check
      - name: Build execution daemon
        run: make build-daemon
