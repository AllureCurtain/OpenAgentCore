name: core-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parsar_agents_api_core_ci_tests
          POSTGRES_USER: agents_api
          POSTGRES_PASSWORD: core_test_only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U agents_api -d parsar_agents_api_core_ci_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_HOME: /home/runner/.parsar/cache/executor-cargo
      CARGO_TARGET_DIR: /home/runner/.parsar/cache/executor-target
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned check prerequisites
        run: |
          npm install --global pnpm@10.30.3
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.parsar/cache/executor-cargo
            ~/.parsar/cache/executor-target
          key: core-executor-${{ runner.os }}-${{ hashFiles('packages/codex-executor/Cargo.lock') }}
      - name: Check standalone repository
        env:
          PARSAR_AGENTS_API_TEST_DATABASE_URL: postgres://agents_api:core_test_only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/parsar_agents_api_core_ci_tests?sslmode=disable
        run: make check
      - name: Build execution daemon
        run: make build-daemon
