# Builds and tests the website once for core-check; main also deploys that artifact.
name: website

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: website-${{ github.run_id }}
  # Never cancel a run that may be deploying main.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      contents: read
      # configure-pages reads the site's base path.
      pages: read
    env:
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          # Full history gives each page its last-updated date.
          fetch-depth: 0
      - uses: ./.github/actions/node
        with:
          lockfiles: website/pnpm-lock.yaml
      - name: Read the Pages base path
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v6
      - name: Build and test
        run: make check-website
        env:
          WEBSITE_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Upload the site
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    if: inputs.publish
    runs-on: ${{ vars.OAC_USE_GITHUB_RUNNERS == 'true' && 'ubuntu-24.04' || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: website-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
